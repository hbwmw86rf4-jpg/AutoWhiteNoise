# XcodeGen spec. `scripts/bootstrap.sh` turns this into AutoWhiteNoise.xcodeproj.
# The .xcodeproj is not committed; this file is the source of truth.
name: AutoWhiteNoise
options:
  bundleIdPrefix: com.CHANGEME            # set to your reverse-DNS prefix, e.g. com.yourname
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""                   # fill in, or pick your team in Xcode > Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
packages:
  NoiseCore:
    path: NoiseCore
targets:
  AutoWhiteNoise:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: ["Info.plist", "AutoWhiteNoise.entitlements"]
    dependencies:
      - package: NoiseCore
    settings:
      base:
        # Point at the hand-written files. (XcodeGen's `info:`/`entitlements:`
        # keys would *generate* and overwrite them, dropping the background-audio
        # and local-network keys.)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/AutoWhiteNoise.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.CHANGEME.AutoWhiteNoise
        PRODUCT_NAME: AutoWhiteNoise
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
